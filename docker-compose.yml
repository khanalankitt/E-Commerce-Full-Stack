services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    container_name: e-commerce-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    container_name: e-commerce-backend
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/e-commerce
      NODE_ENV: development
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    container_name: e-commerce-frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:5000/api
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  mongo-data:
